<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filmeasta</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a class="marca" href="/"><img src="logofilmeasta.png" alt="Filmeasta"></a>
    <form id="form-busqueda">
      <input type="text" id="input-busqueda" placeholder="Buscar una película..." required>
      <button type="submit">Buscar</button>
    </form>
    <div id="zona-usuario">

    </div>
  </header>

  <main>
    <div class="barra-lista">
      <h2 id="titulo-lista">Películas populares</h2>
      <div class="filtros">
        <label>Género
          <select id="filtro-genero"><option value="">Todos</option></select>
        </label>
        <label>Ordenar por
          <select id="filtro-orden">
            <option value="popularity.desc">Más populares</option>
            <option value="vote_average.desc">Mejor puntuadas</option>
            <option value="primary_release_date.desc">Más recientes</option>
          </select>
        </label>
      </div>
    </div>
    <section id="lista-peliculas" class="grilla"></section>
    <div class="mas">
      <button id="cargar-mas" class="boton-secundario oculto">Cargar más</button>
    </div>
  </main>

  <div id="modal" class="modal oculto">
    <div class="modal-contenido">
      <button id="cerrar-modal" class="cerrar">✕</button>
      <div id="detalle"></div>

      <h3>Reseñas <span id="resumen-resenas" class="resumen-resenas"></span></h3>
      <div id="lista-resenas"></div>

      <h3>Escribí tu reseña</h3>
      <p id="aviso-login" class="suave oculto">
        Tenés que <a href="#" id="link-login">iniciar sesión</a> para escribir una reseña.
      </p>
      <form id="form-resena">
        <label>Puntaje:
          <select id="resena-puntaje">
            <option value="5">★★★★★ (5)</option>
            <option value="4">★★★★ (4)</option>
            <option value="3">★★★ (3)</option>
            <option value="2">★★ (2)</option>
            <option value="1">★ (1)</option>
          </select>
        </label>
        <textarea id="resena-texto" rows="3" placeholder="¿Qué te pareció?" required></textarea>
        <button type="submit">Publicar reseña</button>
      </form>
    </div>
  </div>

  <div id="modal-usuario" class="modal oculto">
    <div class="modal-contenido">
      <button id="cerrar-usuario" class="cerrar">✕</button>
      <h2 id="usuario-titulo"></h2>
      <p id="usuario-resumen" class="suave"></p>
      <div id="usuario-resenas"></div>
    </div>
  </div>

  <div id="modal-auth" class="modal oculto">
    <div class="modal-contenido modal-chico">
      <button id="cerrar-auth" class="cerrar">✕</button>
      <h2 id="auth-titulo">Iniciar sesión</h2>
      <form id="form-auth">
        <input type="text" id="auth-usuario" placeholder="Usuario (letras, números o _)" pattern="[A-Za-z0-9_]{3,20}" title="3 a 20 caracteres: letras, números o guion bajo" autocomplete="username" required>
        <input type="password" id="auth-clave" placeholder="Contraseña (mínimo 6 caracteres)" minlength="6" maxlength="72" autocomplete="current-password" required>
        <p id="auth-error" class="error oculto"></p>
        <button type="submit" id="auth-boton">Entrar</button>
      </form>
      <p class="suave">
        <span id="auth-cambio-texto">¿No tenés cuenta?</span>
        <a href="#" id="auth-cambio">Registrate</a>
      </p>
    </div>
  </div>

  <footer>
    <p>Este producto usa la API de TMDB pero no está avalado ni certificado por TMDB.<br>
    <small>This product uses the TMDB API but is not endorsed or certified by TMDB.</small></p>
  </footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
